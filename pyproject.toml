[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-package"
version = "0.1.0"
description = "A short description of your project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.10",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
my-package = "my_package.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["my_package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=my_package --cov-report=term-missing"

[tool.ruff]
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["my_package"]
